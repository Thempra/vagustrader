version: "3.9"

x-polymarket-hosts: &polymarket-hosts
  # Ver docker-compose.live.yml: bloqueo SNI/IP del ISP hacia las IPs que
  # devuelve DNS de Polymarket; fijamos hostnames a una IP Cloudflare válida.
  - "clob.polymarket.com:104.17.207.5"
  - "gamma-api.polymarket.com:104.17.207.5"
  - "data-api.polymarket.com:104.17.207.5"
  - "ws-subscriptions-clob.polymarket.com:104.17.207.5"
  - "www.clob.polymarket.com:104.17.207.5"
  - "relayer-v2.polymarket.com:104.17.207.5"

services:
  bot:
    build: .
    command: vagustrader run --paper
    env_file: .env
    extra_hosts: *polymarket-hosts
    volumes:
      - data:/app/data
      - logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "[ \"$(cat /proc/1/comm)\" = \"vagustrader\" ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build: .
    command: vagustrader dashboard --config /app/config.yml
    extra_hosts: *polymarket-hosts
    volumes:
      - data:/app/data
    ports:
      - "18080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  data:
  logs:
