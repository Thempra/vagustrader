version: "3.9"

services:
  bot:
    build: .
    command: vagustrader run --paper
    env_file: .env
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build: .
    command: vagustrader dashboard
    volumes:
      - ./data:/app/data
    ports:
      - "18080:8080"
    restart: unless-stopped
