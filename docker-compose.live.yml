version: "3.9"

x-polymarket-hosts: &polymarket-hosts
  # ISP SNI/IP block (oct-2026): the two Cloudflare IPs Polymarket DNS returns
  # (104.18.34.205 / 172.64.153.51) get TLS-reset from this hosting's egress,
  # but other Cloudflare IPs in the same PoP serve vhost+SNI correctly.
  # Pin the hostnames to a working Cloudflare IP (verified 2026-10-06).
  - "clob.polymarket.com:104.17.207.5"
  - "gamma-api.polymarket.com:104.17.207.5"
  - "data-api.polymarket.com:104.17.207.5"
  - "ws-subscriptions-clob.polymarket.com:104.17.207.5"
  - "www.clob.polymarket.com:104.17.207.5"
  - "relayer-v2.polymarket.com:104.17.207.5"

services:
  bot:
    build: .
    command: vagustrader run --config /app/config.live.yml
    env_file: .env
    extra_hosts: *polymarket-hosts
    volumes:
      - data:/app/data
      - logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "[ \"$(cat /proc/1/comm)\" = \"vagustrader\" ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build: .
    command: vagustrader dashboard --config /app/config.live.yml --db data/vagustrader.db
    extra_hosts: *polymarket-hosts
    volumes:
      - data:/app/data
    ports:
      - "18081:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  data:
  logs:
