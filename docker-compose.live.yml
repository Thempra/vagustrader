version: "3.9"

services:
  bot:
    build: .
    command: vagustrader run --config /app/config.live.yml
    env_file: .env
    volumes:
      - data:/app/data
      - logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "[ \"$(cat /proc/1/comm)\" = \"vagustrader\" ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build: .
    command: vagustrader dashboard --config /app/config.live.yml --db data/vagustrader.db
    volumes:
      - data:/app/data
    ports:
      - "18081:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  data:
  logs:
