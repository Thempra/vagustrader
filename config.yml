risk:
  max_position_usdc: 10.0
  max_open_positions: 2000
  max_open_positions_global: 5000
  daily_loss_limit_usdc: 200.0

strategies:
  copy_trading:
    enabled: true
    poll_interval_seconds: 120
    min_pnl: 5000
    min_volume_usd: 1000
    price_guard: 0.05
    max_copy_per_trader: 5
    max_days_to_resolution: 7
    min_entry_price: 0.15
    max_entry_price: 0.80
    blocked_sports:
      - nba
      - nhl
    size_tiers:
      - min_price: 0.30
        max_price: 0.60
        size_usdc: 10.0
      - min_price: 0.15
        max_price: 0.30
        size_usdc: 5.0
      - min_price: 0.60
        max_price: 0.80
        size_usdc: 3.0
    min_trader_win_rate: 0.60

  settlement:
    enabled: true
    interval_seconds: 300

  under_hunter:
    enabled: true
    poll_interval_seconds: 120
    min_price: 0.48
    max_price: 0.55
    max_position: 10.0
    kelly_fraction: 0.25
    allowed_sports: []

  whale_consensus:
    enabled: true
    poll_interval_seconds: 180
    min_traders: 2
    min_pnl: 5000
    max_position: 10.0
    kelly_fraction: 0.25

  arbitrage:
    enabled: true
    poll_interval_seconds: 60
    min_profit_usdc: 0.01
    max_position: 50.0

  contrarian:
    enabled: true
    poll_interval_seconds: 120
    price_change_threshold: 0.10
    lookback_minutes: 60
    max_position: 5.0
    kelly_fraction: 0.15

  resolution_sniper:
    enabled: true
    poll_interval_seconds: 300
    min_price: 0.90
    max_price: 0.97
    max_days_to_end: 7
    min_volume: 5000
    max_position: 20.0
    kelly_fraction: 0.10

  momentum_rider:
    enabled: true
    poll_interval_seconds: 60
    price_change_threshold: 0.05
    volume_spike_multiplier: 2.0
    lookback_minutes: 30
    max_position: 5.0
    kelly_fraction: 0.15

  deep_value:
    enabled: true
    poll_interval_seconds: 120
    max_price: 0.15
    min_volume: 10000
    max_position: 8.0
    kelly_fraction: 0.20

  volume_surge:
    enabled: true
    poll_interval_seconds: 120
    surge_multiplier: 3.0
    min_baseline_volume: 5000
    min_price_move: 0.03
    lookback_minutes: 60
    max_position: 6.0
    kelly_fraction: 0.15

markets:
  min_liquidity_usdc: 1000
